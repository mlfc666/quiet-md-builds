name: sync-upstream

# Keeps two branches level with s1dashu/quiet-md:
#
#   upstream-main   everything upstream has, checked every hour. daily-build
#                   turns its tip into the date-stamped pre-releases.
#   main            only what upstream *released*: one merge per upstream release
#                   tag, so main and the stable builds follow upstream's releases
#                   rather than its commits.
#
# The fork only adds files (workflows, the packaging scripts, this sync), which
# is why a plain merge is enough and why the merges cannot conflict; a future
# change that does touch upstream code surfaces as a conflict instead of a
# silently dropped patch. scripts/ci-merge-upstream.sh holds that merge.
on:
  schedule:
    # Hourly: "real time" for a mirror, and cheap — a run with nothing to merge
    # finishes in under a minute. Use '*/30 * * * *' for half-hourly.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild the newest upstream release even if it is already released here'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Add the upstream remote
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/s1dashu/quiet-md.git 2>/dev/null ||
            git remote set-url upstream https://github.com/s1dashu/quiet-md.git
          git fetch --no-tags upstream main
          echo "upstream main: $(git rev-parse upstream/main)"

      # The rolling branch: everything upstream has. It starts where the fork is
      # on its first run and is only ever advanced by a merge of upstream main.
      - name: Track upstream main
        run: scripts/ci-merge-upstream.sh upstream-main upstream/main main

      # The stable branch. Upstream tags are fetched into a private namespace
      # because `refs/tags/` holds this fork's own tags, whose commits are its
      # merges; overwriting one would move a release that is already published.
      - name: Release the newest upstream tag on main
        id: release
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force upstream 'refs/tags/v*:refs/upstream/tags/v*'
          latest=$(git for-each-ref --format='%(refname:lstrip=3)' refs/upstream/tags \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$latest" ]; then
            echo 'upstream has no release tags.'
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "newest upstream release: $latest"

          if git rev-parse -q --verify "refs/tags/$latest" > /dev/null; then
            if [ "$FORCE" != true ]; then
              echo "$latest is already released here."
              echo 'released=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "rebuilding $latest on request."
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            echo 'released=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "refs/upstream/tags/$latest" refs/remotes/origin/main; then
            # main is already past this release — a tag cut from a maintenance
            # branch, or one main merged before the split. Tag the released
            # commit itself rather than newer code wearing its version number.
            target="refs/upstream/tags/$latest^{commit}"
            echo "main already contains $latest; tagging the upstream commit."
          else
            scripts/ci-merge-upstream.sh main "refs/upstream/tags/$latest" main
            target=$(git rev-parse HEAD)
          fi

          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$latest" ]; then
            echo "::warning::$latest carries version $version in Cargo.toml; tagging it as $latest."
          fi

          git tag -a "$latest" "$target" -m "Quiet.md ${latest#v} (upstream release)"
          git push origin "refs/tags/$latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo 'released=true' >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start the `push: tags` build
      # workflows, so the builds are requested explicitly. The REST endpoint is
      # used directly because `gh workflow run` reports failures only through its
      # exit code, in a log that some networks cannot download.
      - name: Dispatch the stable builds
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          failed=0
          for wf in build-linux build-macos build-windows; do
            code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf.yml/dispatches" \
              -d "{\"ref\":\"$TAG\"}")
            if [[ $code == 204 ]]; then
              echo "  $wf requested on $TAG"
            else
              echo "::error::$wf dispatch failed (HTTP $code): $(head -c 300 /tmp/dispatch.json)"
              failed=1
            fi
          done
          exit $failed

      - name: Summary
        run: |
          {
            echo '### Upstream sync'
            echo ''
            echo "- newest upstream release: \`${{ steps.release.outputs.tag || 'none' }}\`"
            echo "- released here: \`${{ steps.release.outputs.released || 'false' }}\`"
            echo "- upstream-main: advanced by the tracking step above, when upstream moved"
          } >> "$GITHUB_STEP_SUMMARY"
