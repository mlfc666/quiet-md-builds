name: sync-upstream

# Keeps this repository level with s1dashu/quiet-md.
#
# The fork only *adds* files (workflows, packaging scripts, docs); it never edits
# upstream sources. That is why this merges instead of replaying patches the way
# patch-based forks (MindustryX and friends) have to: a merge of two disjoint
# change sets cannot conflict, and if a future change does touch upstream code
# the merge reports it instead of silently dropping a patch.
#
# When upstream moves, the merge is pushed to main and the build workflows are
# dispatched explicitly, because a push made with GITHUB_TOKEN does not trigger
# other workflows.
on:
  schedule:
    # Every six hours; upstream releases are not more frequent than that.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when upstream has no new commits'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A token that can push to main; the default GITHUB_TOKEN is enough
          # here because the workflow only writes to this repository.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/s1dashu/quiet-md.git
          git fetch --no-tags upstream main
          upstream_sha=$(git rev-parse upstream/main)
          echo "upstream=$upstream_sha"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Upstream is already contained in main."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-edit keeps the default merge message; a conflict fails the job
          # loudly instead of leaving a half-merged tree behind.
          if ! git merge --no-edit "$upstream_sha"; then
            echo "::error::Upstream merge conflicts with this fork's changes; resolve by hand."
            git merge --abort || true
            exit 1
          fi

          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          git log --oneline -3

      - name: Push the merge
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:main

      - name: Tag the new upstream version
        if: steps.merge.outputs.updated == 'true'
        id: tag
        run: |
          set -euo pipefail
          version=${{ steps.merge.outputs.version }}
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; builds will be dispatched without a new tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$tag" -m "Quiet.md $version (upstream sync)"
            git push origin "$tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start other workflows, so the
      # builds are requested explicitly. Without a tag they only produce
      # artifacts; with a tag they also attach to the release.
      - name: Dispatch the builds
        if: steps.merge.outputs.updated == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref=${{ steps.tag.outputs.created == 'true' && steps.tag.outputs.tag || 'main' }}
          echo "Dispatching builds on $ref"
          for wf in build-linux build-macos build-windows; do
            gh workflow run "$wf.yml" --ref "$ref"
            echo "  $wf requested"
          done

      - name: Summary
        run: |
          {
            echo "### Upstream sync"
            echo ""
            echo "- upstream: \`${{ steps.merge.outputs.updated }}\` updated"
            echo "- version: \`${{ steps.merge.outputs.version || 'unchanged' }}\`"
            echo "- tag created: \`${{ steps.tag.outputs.created || 'no' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
