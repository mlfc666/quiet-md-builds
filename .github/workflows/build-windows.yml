name: build-windows

# windows-2022 carries the Visual Studio 2022 C++ tools and Inno Setup 6, which
# is exactly what package-windows.ps1 expects. arm64 is best effort: the app
# builds there but the GPIO-style native deps are only exercised on x64.
on:
  workflow_dispatch:
    inputs:
      # daily-build dispatches these on a date-stamped tag. Without this the
      # release would look like a stable one: a pre-release may not claim the
      # "Latest" badge, and GitHub refuses `make_latest: true` for one.
      prerelease:
        description: 'Attach the files to a pre-release (daily build)'
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-windows.yml'
      - 'scripts/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    name: windows-${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            experimental: false
          - arch: arm64
            target: aarch64-pc-windows-msvc
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}

      # `build.rs` writes CARGO_PKG_VERSION into the resource script's
      # FILEVERSION, which takes four 16-bit integers, so a pre-release version
      # (`0.1.14-daily.20261126`, the daily builds) fails the resource compiler:
      # `error RC2237: numeric value expected at daily`. The fix upstream's build
      # script lacks is one expression, applied here rather than on a branch
      # because upstream owns the file and the stable builds never need it —
      # for `0.1.14` it produces exactly the same `0,1,14,0` as before.
      - name: Keep the resource version numeric
        shell: python
        run: |
          import pathlib, sys

          build_rs = pathlib.Path('build.rs')
          source = build_rs.read_text(encoding='utf-8')
          before = """let numbers = format!("{},0", version.replace('.', ","));"""
          after = """let numbers = format!("{},0", version.split(|c| c == '-' || c == '+').next().unwrap_or("").replace('.', ","));"""
          if before not in source:
              sys.exit('build.rs no longer matches this workaround; delete the step or update it')
          build_rs.write_text(source.replace(before, after, 1), encoding='utf-8')
          print('build.rs: FILEVERSION takes the numeric part of the version')

      - name: Build with the VS developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          $arch = if ('${{ matrix.arch }}' -eq 'x64') { 'x64' } else { 'arm64' }
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=x64"
          cargo build --release --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $env:PATH = "$PWD\target\${{ matrix.target }}\release;$env:PATH"
          scripts/package-windows.ps1 -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'packaging failed' }

      - name: Collect packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # package-windows.ps1 hard-codes the x64 name, so an arm64 build would
          # otherwise ship a file called ...-windows-x64-setup.exe.
          # Only the installer and its checksum: the raw quiet_md.exe that
          # package-windows.ps1 also drops in that directory is not a package.
          foreach ($f in Get-ChildItem dist\windows\unsigned\* -Include *-setup.exe,*-setup.exe.sha256 -Recurse) {
            $name = $f.Name
            if ('${{ matrix.arch }}' -ne 'x64') { $name = $name -replace 'windows-x64', 'windows-${{ matrix.arch }}' }
            Copy-Item $f.FullName (Join-Path artifacts $name)
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-md-windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'x64'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          # `inputs` is empty on a tag push, so a stable release stays one.
          prerelease: ${{ inputs.prerelease || false }}
          make_latest: ${{ inputs.prerelease && 'false' || 'legacy' }}
          # A daily build re-runs the same tag when a runner was unavailable, so
          # replacing the files an earlier run uploaded has to be allowed.
          overwrite_files: true
